name: Generate gh-ascii Profile Cards

on:
  # Run automatically every 24 hours
  schedule:
    - cron: "0 0 * * *"

  # Allows manual triggering from the Actions tab
  workflow_dispatch:

  # Run automatically on every push to main branch
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Create output directory
      - name: Prepare Output Directory
        run: mkdir -p dist

      # Download dark theme
      - name: Generate Dark Mode Card
        run: |
          curl -fL \
            "https://gh.crafter.run/nosibbiswas22?theme=dark&bg=keep" \
            -o dist/dark_mode.svg

      # Download light theme
      - name: Generate Light Mode Card
        run: |
          curl -fL \
            "https://gh.crafter.run/nosibbiswas22?theme=light&bg=keep" \
            -o dist/light_mode.svg

      # Deploy generated SVGs to output branch
      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: gh-ascii-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}